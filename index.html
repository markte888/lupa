<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Лупа</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f0f0f;--panel:#181818;--panel2:#202020;--line:#2c2c2c;--text:#f1f1f1;--muted:#9a9a9a;--acc:#e8b86a;--f:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 var(--f);-webkit-font-smoothing:antialiased}
a{color:inherit}button,input{font:inherit;color:inherit}[hidden]{display:none!important}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:20px;padding:12px 24px;background:rgba(15,15,15,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.logo{font-weight:700;font-size:22px;letter-spacing:-.02em}.logo i{color:var(--acc);font-style:normal}
.tabs{display:flex;gap:4px;flex:1;flex-wrap:wrap}
.tabs button{border:0;background:transparent;color:var(--muted);padding:9px 16px;border-radius:999px;cursor:pointer;font-weight:500;font-size:15px}
.tabs button:hover{color:var(--text)}.tabs button.on{background:var(--text);color:#111}
.tabs small{opacity:.55;margin-left:5px}
.btn{display:inline-flex;align-items:center;gap:6px;font-weight:500;border:1px solid var(--line);background:transparent;padding:9px 16px;border-radius:999px;cursor:pointer;white-space:nowrap;font-size:14px;text-decoration:none}
.btn:hover{border-color:#555}.btn.primary{background:var(--text);color:#111;border-color:var(--text)}.btn.ghost{border-color:transparent;color:var(--muted)}.btn.ghost:hover{color:var(--text)}
.btn.star.on{color:var(--acc);border-color:var(--acc)}
main{padding:22px 24px 60px;max-width:1900px;margin:0 auto}
.bar{display:flex;gap:10px;max-width:760px;margin:0 auto 22px}
.bar input{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:14px 22px;outline:none;font-size:17px}
.bar input:focus{border-color:#555}
.hero{min-height:50vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.hero h1{font-size:clamp(32px,5vw,54px);letter-spacing:-.03em;margin:0 0 8px}
.hero p{color:var(--muted);margin:0 0 24px;max-width:560px}
.hero .bar{width:100%}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 13px;font-size:13px;color:var(--muted);cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.chip:hover{color:var(--text);border-color:#555}
.chip .x,.chip .s{opacity:.7}.chip .x:hover,.chip .s:hover{opacity:1;color:var(--acc)}
.chip em{font-style:normal;font-size:11px;color:var(--acc)}
.rhead{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.rhead h2{font-size:28px;letter-spacing:-.02em;margin:0}
.rhead .l{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.sub{color:var(--muted);font-size:14px}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}.seg button{border:0;background:transparent;padding:8px 14px;cursor:pointer;color:var(--muted);font-size:14px}.seg button.on{background:#262626;color:var(--text)}
.status{color:var(--muted);text-align:center;padding:22px;font-size:14px;min-height:20px}
.sw{position:relative;flex:1;display:flex}
.sugg{position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:30;background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.5);text-align:left}
.sugg div{padding:10px 18px;cursor:pointer;display:flex;flex-direction:column;gap:1px}
.sugg div:hover,.sugg div.on{background:#262626}
.sugg b{font-weight:600;font-size:15px}.sugg span{color:var(--muted);font-size:13px}
.sugg .ph{color:var(--acc)}
/* grid */
.masonry{columns:236px;column-gap:12px}
.tile{break-inside:avoid;margin:0 0 12px;border-radius:14px;overflow:hidden;background:var(--panel2);position:relative;cursor:zoom-in;animation:in .35s both}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.tile img{display:block;width:100%;height:auto}
.tile .ov{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:10px;background:linear-gradient(rgba(0,0,0,.3),transparent 30%,transparent 55%,rgba(0,0,0,.8));opacity:0;transition:.2s}
.tile:hover .ov{opacity:1}
.ov .tr{display:flex;justify-content:flex-end}
.ov .src{font-size:12px;line-height:1.35;color:#ddd;text-decoration:none}.ov .src b{display:block;color:#fff;font-weight:600}
.pin{border:0;background:rgba(15,15,15,.75);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px;font-weight:600;color:#fff}
.pin.on{background:var(--acc);color:#111}
.tile .pin.on{opacity:1}
/* carousel */
.cv{display:flex;align-items:center;gap:22px;overflow-x:auto;scroll-snap-type:x mandatory;height:calc(100vh - 290px);min-height:340px;scrollbar-width:none;margin:0 -24px}
.cv::-webkit-scrollbar{display:none}
.cv .pad{flex:0 0 calc(50% - 22px)}
.slide{flex:0 0 auto;height:100%;scroll-snap-align:center;display:flex;align-items:center;opacity:.3;transform:scale(.94);transition:opacity .4s,transform .4s;cursor:pointer}
.slide.on{opacity:1;transform:none;cursor:zoom-in}
.slide img{max-height:100%;max-width:78vw;display:block;border-radius:4px;box-shadow:0 30px 80px rgba(0,0,0,.5);min-width:120px;background:var(--panel2)}
.cvbar{display:flex;align-items:center;gap:10px;padding-top:14px;flex-wrap:wrap}
.cvbar .cap{flex:1;min-width:160px;font-size:14px;color:#d6d1c6}.cvbar .cap b{color:#fff}.cvbar .cap a{color:var(--acc);text-decoration:none}
.arrow{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:transparent;font-size:22px;cursor:pointer}
.cvbar .pin{padding:9px 16px;background:#262626}.cvbar .pin.on{background:var(--acc)}
/* key panel */
.empty{max-width:640px;margin:30px auto;border:1px solid var(--line);border-radius:18px;padding:30px;background:var(--panel)}
.empty h2{margin:0 0 8px;font-size:24px;letter-spacing:-.02em}
.empty ol{line-height:1.9;padding-left:20px}.empty a{color:var(--acc)}
.empty input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;outline:none;margin:10px 0}
/* lightbox */
.lb{position:fixed;inset:0;z-index:50;background:rgba(8,8,8,.97);display:flex;flex-direction:column}
.lb .st{flex:1;display:grid;place-items:center;padding:20px 70px 8px;min-height:0}
.lb .st{overflow:hidden}
.lb .st img{display:block;width:auto;height:auto;max-width:calc(100vw - 150px);max-height:calc(100vh - 120px);max-height:calc(100dvh - 120px);object-fit:contain}
.lb .nav{position:absolute;top:50%;transform:translateY(-50%);width:50px;height:50px;border-radius:50%;border:1px solid #333;background:rgba(20,20,20,.6);font-size:24px;cursor:pointer}
.lb .pv{left:14px}.lb .nx{right:14px}.lb .cl{position:absolute;top:14px;right:14px}
.lb .lbar{display:flex;gap:12px;align-items:center;padding:12px 22px 18px;flex-wrap:wrap}
.lb .t{flex:1;min-width:200px}.lb .t b{display:block}.lb .t span{color:var(--muted);font-size:13px}
.lb .pin{padding:9px 16px;background:#262626}.lb .pin.on{background:var(--acc)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:80;background:var(--text);color:#111;padding:10px 18px;border-radius:999px;font-weight:500;font-size:14px}
@media(max-width:700px){.top{padding:10px 12px;gap:8px;flex-wrap:wrap}.tabs{order:3;flex-basis:100%}.tabs button{padding:7px 11px;font-size:14px}main{padding:14px 12px 60px}.masonry{columns:2;column-gap:8px}.tile{margin-bottom:8px;border-radius:10px}.cv{margin:0 -12px;gap:10px;height:calc(100vh - 330px)}.slide img{max-width:84vw}.lb .st{padding:10px}.lb .st img{max-width:calc(100vw - 20px);max-height:calc(100dvh - 170px)}.ov{opacity:1!important;background:linear-gradient(transparent 60%,rgba(0,0,0,.7))!important}.ov .src{display:none}}
</style>
</head>
<body>
<header class="top">
  <div class="logo">Лупа<i>.</i></div>
  <nav class="tabs" id="tabs">
    <button data-t="search">Поиск</button>
    <button data-t="pins">Пины<small id="nPins"></small></button>
    <button data-t="favs">Избранные<small id="nFavs"></small></button>
  </nav>
  <button class="btn ghost" id="keyBtn" title="Ключ поиска">⚙︎</button>
</header>
<main id="main"></main>

<div class="lb" id="lb" hidden>
  <button class="btn cl" id="lbX">Закрыть ✕</button>
  <div class="st" id="lbSt"><img id="lbImg" alt="" referrerpolicy="no-referrer"></div>
  <button class="nav pv" id="lbP">‹</button><button class="nav nx" id="lbN">›</button>
  <div class="lbar"><div class="t" id="lbT"></div><span class="sub" id="lbC"></span><button class="pin" id="lbPin">📌 Пин</button><a class="btn" id="lbSrc" target="_blank" rel="noopener">Источник ↗</a></div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS = {
  get(k, d){ try { const v = localStorage.getItem('lupa2.' + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v){ try { localStorage.setItem('lupa2.' + k, JSON.stringify(v)); } catch { toast('Память браузера заполнена'); } }
};
let tt; function toast(t, ms = 2400){ const el = $('#toast'); el.textContent = t; el.hidden = false; clearTimeout(tt); tt = setTimeout(() => el.hidden = true, ms); }
const slug = n => n.trim().toLowerCase().replace(/\s+/g, ' ');
const hashStr = s => { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return Math.abs(h).toString(36); };
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pl = (n, a, b, c) => { const m = n % 10, h = n % 100; return m === 1 && h !== 11 ? a : (m >= 2 && m <= 4 && (h < 10 || h >= 20) ? b : c); };

/* ============ state ============ */
let tab = LS.get('tab', 'search');
let mode = LS.get('mode', 'cv');                 // 'cv' carousel | 'grid'
let query = LS.get('query', '');
let favs = LS.get('favs', []);                   // [{name, added}]
let pins = LS.get('pins', []);                   // [{id,img,thumb,w,h,title,link,domain,owner}]
const key = () => LS.get('key', '');
const isFav = n => favs.some(f => slug(f.name) === slug(n));
const isPinned = id => pins.some(p => p.id === id);

/* ============ image search (Serper → Google Images) ============ */
const TAILS = ['photography artwork', 'photographs by', 'photograph print', 'photography work', 'artwork', 'gelatin silver print', 'chromogenic print', 'vintage print', 'photography series', 'photobook pages', 'photography exhibition installation', 'photograph museum collection', 'photograph gallery', 'photograph auction lot', 'black and white photograph', 'color photograph', 'untitled photograph', 'photographs archive', 'photography retrospective', 'Fotografie Werk', 'photographie œuvre', 'fotografia opera', 'photograph 1950s', 'photograph 1970s', 'photograph 1990s', 'photography book'];
const normUrl = u => String(u || '').toLowerCase().replace(/^https?:\/\/(www\.)?/, '').replace(/[?#].*$/, '').replace(/(-\d+x\d+|_\d+x\d+|-scaled|@2x)(?=\.\w+$)/, '');
const cache = n => LS.get('c2.' + slug(n), null) || { items: [], step: 0, done: false };
const saveCache = (n, d) => LS.set('c2.' + slug(n), d);
const toObj = (a, owner) => ({ id: hashStr(a[0]), img: a[0], thumb: a[1], w: a[2], h: a[3], title: a[4], link: a[5], domain: a[6], owner });
const cachedItems = n => cache(n).items.map(a => toObj(a, n));
const running = new Set();
/* skip pictures OF the photographer (portraits, interviews, obituaries) — we want their work */
function aboutPerson(x, name){
  const t = String(x.title || '').toLowerCase(), n = name.toLowerCase(), d = String(x.domain || x.source || '').toLowerCase();
  if (/self[- ]?portrait|автопортрет/.test(t)) return false;
  if (/(portrait|photo|picture|headshot|image) of\b|headshot|interview|obituary|biography|\bdies\b|\bdied\b|\bbio\b|meet the|who is|wikipedia|портрет|интервью|биограф/.test(t)) return true;
  const bare = t.replace(/[-–|:,.()]/g, ' ').replace(/\b(photographer|artist|photography|american|french|british|german|japanese)\b/g, ' ').replace(/\s+/g, ' ').trim();
  if (bare === n || bare === n.split(' ').reverse().join(' ')) return true;   // a caption that is just the name = profile photo
  if (/wikipedia|wikimedia/.test(d) && t.includes(n.split(' ').pop()) && !/\b(19|20)\d\d\b|untitled|print/.test(t)) return true;
  return false;
}

async function serper(q){
  const r = await fetch('https://google.serper.dev/images', { method: 'POST', headers: { 'X-API-KEY': key(), 'Content-Type': 'application/json' }, body: JSON.stringify({ q, safe: 'active' }) });
  if (r.status === 401 || r.status === 403) throw { code: 'key' };
  if (r.status === 429) throw { code: 'rate' };
  if (!r.ok) throw { code: 'http', status: r.status, text: await r.text().catch(() => '') };
  const j = await r.json(); return Array.isArray(j.images) ? j.images : [];
}
/* runs `steps` more queries for a name. returns array of new items, or null when nothing more can be loaded */
async function fetchMore(name, steps){
  const s = slug(name); if (running.has(s) || !key()) return null;
  const d = cache(name); if (d.done) return null;
  running.add(s);
  const seen = new Set(d.items.map(a => normUrl(a[0]))), seenT = new Set(d.items.map(a => a[1]));
  const base = name.replace(/["']/g, '').trim(); const fresh = [];
  try {
    for (let n = 0; n < steps && d.step < TAILS.length; n++) {
      const res = await serper(base + ' ' + TAILS[d.step]); d.step++;
      for (const x of res) {
        const img = x.imageUrl; if (!img || !/^https?:/.test(img)) continue;
        if (aboutPerson(x, base)) continue;
        const k = normUrl(img); if (seen.has(k) || (x.thumbnailUrl && seenT.has(x.thumbnailUrl))) continue;
        seen.add(k); if (x.thumbnailUrl) seenT.add(x.thumbnailUrl);
        const a = [img, x.thumbnailUrl || '', x.imageWidth || 0, x.imageHeight || 0, String(x.title || '').slice(0, 90), x.link || '', x.domain || x.source || ''];
        d.items.push(a); fresh.push(toObj(a, name));
      }
      if (d.step >= TAILS.length) d.done = true;
    }
    saveCache(name, d);
    return fresh;
  } catch (e) {
    saveCache(name, d);
    if (e.code === 'key') { toast('Ключ поиска не подошёл — проверьте его в ⚙︎', 5000); }
    else if (e.code === 'rate') toast('Сервис поиска просит паузу — попробуйте через минуту');
    else if (e.code === 'http') toast(/credit|quota|balance/i.test(e.text) ? 'Закончились запросы Serper — пополните на serper.dev' : 'Ошибка поиска: ' + e.status);
    else toast('Нет соединения с поиском');
    return fresh.length ? fresh : null;
  } finally { running.delete(s); }
}

/* visual duplicate check on tiny thumbnails (when the browser allows reading them) */
let hashes = new Map();
function dhash(url){
  return new Promise(res => {
    if (!url) return res(null);
    const im = new Image(); im.crossOrigin = 'anonymous'; im.referrerPolicy = 'no-referrer';
    im.onload = () => { try { const c = document.createElement('canvas'); c.width = 9; c.height = 8; const x = c.getContext('2d', { willReadFrequently: true }); x.drawImage(im, 0, 0, 9, 8); const p = x.getImageData(0, 0, 9, 8).data; let b = ''; for (let y = 0; y < 8; y++) for (let i = 0; i < 8; i++) { const a = (y * 9 + i) * 4; b += (p[a] + p[a+1] + p[a+2]) > (p[a+4] + p[a+5] + p[a+6]) ? '1' : '0'; } res(b); } catch { res(null); } };
    im.onerror = () => res(null); im.src = url;
  });
}
const ham = (a, b) => { let n = 0; for (let i = 0; i < 64; i++) if (a[i] !== b[i]) n++; return n; };

/* ============ view: carousel or grid, with pins and endless loading ============ */
let view = null;
function makeView(box, initial, opts){
  if (view && view.io) view.io.disconnect();
  hashes = new Map();
  const v = { box, items: [], opts, done: false, loading: false, idx: 0, key: opts.key, memo: opts.key ? LS.get('view.' + opts.key, null) : null };
  view = v;
  if (v.memo && Array.isArray(v.memo.ids)) {
    const order = new Map(v.memo.ids.map((id, i) => [id, i]));
    initial = initial.slice().sort((a, b) => (order.has(a.id) ? order.get(a.id) : 1e9) - (order.has(b.id) ? order.get(b.id) : 1e9));
  }
  if (mode === 'grid') {
    box.innerHTML = `<div class="masonry"></div><div class="status"></div>`;
    v.wrap = box.querySelector('.masonry');
  } else {
    box.innerHTML = `<div class="cv"><div class="pad"></div><div class="pad"></div></div>
      <div class="cvbar"><button class="arrow" data-cv="-1">‹</button><button class="arrow" data-cv="1">›</button><span class="sub cn"></span><span class="cap"></span><button class="pin" data-pinactive="1">📌 Пин</button></div><div class="status"></div>`;
    v.wrap = box.querySelector('.cv'); v.endPad = v.wrap.lastElementChild;
    let raf; v.wrap.addEventListener('scroll', () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(() => cvSync(v)); }, { passive: true });
  }
  v.st = box.querySelector('.status');
  add(v, initial);
  if (mode === 'grid') {
    v.io = new IntersectionObserver(es => { if (es[0].isIntersecting) more(v); }, { rootMargin: '1400px' });
    v.io.observe(v.st);
  }
  v.restoring = true;
  requestAnimationFrame(() => requestAnimationFrame(() => {
    const at = v.memo && v.memo.at;
    if (mode === 'cv') {
      const sl = [...v.wrap.querySelectorAll('.slide')]; const i = at ? sl.findIndex(s => s.dataset.id === at) : -1;
      if (i > 0) { const s = sl[i]; v.wrap.scrollLeft = s.offsetLeft + s.offsetWidth / 2 - v.wrap.clientWidth / 2; }
      v.restoring = false; cvSync(v);
    } else {
      if (v.memo && v.memo.y) window.scrollTo(0, v.memo.y);
      v.restoring = false;
    }
  }));
  if (!v.items.length) more(v); else status(v, '');
  return v;
}
function status(v, t){ if (v === view) v.st.textContent = t; }
function add(v, arr){
  for (const it of arr) {
    if (v.items.some(x => x.id === it.id)) continue;
    v.items.push(it);
    const el = document.createElement(mode === 'grid' ? 'figure' : 'div');
    el.dataset.id = it.id;
    const r = it.w && it.h ? `aspect-ratio:${it.w}/${it.h};` : '';
    if (mode === 'grid') {
      el.className = 'tile';
      el.innerHTML = `<img src="${esc(it.img)}" alt="" loading="lazy" referrerpolicy="no-referrer" style="${r}">
        <div class="ov"><div class="tr"><button class="pin ${isPinned(it.id) ? 'on' : ''}" data-pin="${esc(it.id)}">${isPinned(it.id) ? '📌 Запинено' : '📌 Пин'}</button></div>
        <a class="src" href="${esc(it.link || it.img)}" target="_blank" rel="noopener"><b>${esc(it.owner)}</b>${esc(it.domain)} ↗</a></div>`;
      v.wrap.appendChild(el);
    } else {
      el.className = 'slide';
      el.innerHTML = `<img src="${esc(it.img)}" alt="" referrerpolicy="no-referrer" ${v.items.length > 6 ? 'loading="lazy"' : ''} style="${r}">`;
      v.wrap.insertBefore(el, v.endPad);
    }
    const im = el.querySelector('img');
    im.onerror = () => { if (it.thumb && im.src !== it.thumb) { im.src = it.thumb; im.style.aspectRatio = ''; } else drop(v, it.id); };
    dhash(it.thumb).then(h => { if (!h) return; for (const [id, o] of hashes) if (id !== it.id && ham(h, o) <= 2) { drop(v, it.id); return; } hashes.set(it.id, h); });
  }
  if (mode === 'cv') cvSync(v);
  remember(v);
}
function remember(v){
  if (!v.key || v.restoring || v !== view) return;
  const m = LS.get('view.' + v.key, {}) || {};
  m.ids = v.items.map(x => x.id).slice(0, 2000);
  if (mode === 'cv') { const sl = v.wrap.querySelectorAll('.slide')[v.idx]; if (sl) m.at = sl.dataset.id; }
  else m.y = window.scrollY;
  LS.set('view.' + v.key, m);
}
function drop(v, id){
  const el = v.box.querySelector(`[data-id="${id}"]`); if (el) el.remove();
  v.items = v.items.filter(x => x.id !== id);
  if (mode === 'cv') cvSync(v);
}
async function more(v){
  if (v.loading || v.done || !v.opts.more) { if (!v.opts.more && !v.items.length) status(v, v.opts.empty || ''); return; }
  v.loading = true; status(v, 'Ищу снимки…');
  const fresh = await v.opts.more();
  v.loading = false;
  if (v !== view) return;
  if (fresh === null) { v.done = true; status(v, v.items.length ? (mode === 'grid' ? 'Это всё, что нашлось.' : '') : (v.opts.empty || 'Ничего не нашлось.')); return; }
  add(v, fresh); status(v, '');
  if (mode === 'grid') { const r = v.st.getBoundingClientRect(); if (r.top < innerHeight + 1400) more(v); }
  else if (v.items.length - v.idx < 6) more(v);
}
function cvSync(v){
  if (v !== view || mode !== 'cv') return;
  const cv = v.wrap; const sl = [...cv.querySelectorAll('.slide')];
  const bar = v.box.querySelector('.cvbar');
  if (!sl.length) { bar.querySelector('.cn').textContent = ''; bar.querySelector('.cap').innerHTML = ''; bar.querySelector('.pin').hidden = true; return; }
  const mid = cv.scrollLeft + cv.clientWidth / 2; let best = 0, bd = 1e9;
  sl.forEach((s, i) => { const d = Math.abs(s.offsetLeft + s.offsetWidth / 2 - mid); if (d < bd) { bd = d; best = i; } });
  sl.forEach((s, i) => s.classList.toggle('on', i === best));
  v.idx = best;
  if (!v.restoring) remember(v);
  const it = v.items.find(x => x.id === sl[best].dataset.id); if (!it) return;
  bar.querySelector('.cn').textContent = `${best + 1} / ${sl.length}`;
  bar.querySelector('.cap').innerHTML = `<b>${esc(it.owner)}</b> · ${esc(it.title)} · <a href="${esc(it.link || it.img)}" target="_blank" rel="noopener">${esc(it.domain)} ↗</a>`;
  const pb = bar.querySelector('.pin'); pb.hidden = false; pb.dataset.pin = it.id; setPinBtn(pb, isPinned(it.id));
  if (sl.length - best < 6) more(v);
}
function cvGo(v, i){ const sl = v.wrap.querySelectorAll('.slide'); i = Math.max(0, Math.min(sl.length - 1, i)); const s = sl[i]; if (s) v.wrap.scrollTo({ left: s.offsetLeft + s.offsetWidth / 2 - v.wrap.clientWidth / 2, behavior: 'smooth' }); }
function setPinBtn(b, on){ b.classList.toggle('on', on); b.textContent = on ? '📌 Запинено' : '📌 Пин'; }

/* pins */
function togglePin(id){
  const it = (view && view.items.find(x => x.id === id)) || pins.find(p => p.id === id); if (!it) return;
  if (isPinned(id)) { pins = pins.filter(p => p.id !== id); toast('Убрано из пинов'); }
  else { pins.unshift({ id: it.id, img: it.img, thumb: it.thumb, w: it.w, h: it.h, title: it.title, link: it.link, domain: it.domain, owner: it.owner }); toast('Запинено'); }
  LS.set('pins', pins);
  document.querySelectorAll(`[data-pin="${id}"]`).forEach(b => setPinBtn(b, isPinned(id)));
  if (!$('#lb').hidden) syncLb();
  counts();
  if (tab === 'pins' && !isPinned(id) && view) drop(view, id);
}

/* ============ header / tabs ============ */
function counts(){ $('#nPins').textContent = pins.length || ''; $('#nFavs').textContent = favs.length || ''; }
function setTab(t){ tab = t; LS.set('tab', t); render(); window.scrollTo(0, 0); }
$('#tabs').addEventListener('click', e => { const b = e.target.closest('[data-t]'); if (b) setTab(b.dataset.t); });
const modeSeg = () => `<div class="seg"><button data-mode="cv" class="${mode === 'cv' ? 'on' : ''}">Карусель</button><button data-mode="grid" class="${mode === 'grid' ? 'on' : ''}">Сетка</button></div>`;
let showKey = false;
$('#keyBtn').onclick = () => { showKey = true; render(); };

function keyPanel(){
  return `<div class="empty"><h2>Нужен ключ поиска картинок</h2>
    <div class="sub">Снимки приходят из Google Картинок через сервис Serper. Новым пользователям он даёт бесплатные запросы. Ключ вводится один раз и хранится только в этом браузере.</div>
    <ol><li>Зарегистрируйтесь на <a href="https://serper.dev" target="_blank" rel="noopener">serper.dev</a>.</li>
    <li>Откройте <a href="https://serper.dev/api-key" target="_blank" rel="noopener">API Key</a> и скопируйте ключ.</li>
    <li>Вставьте его сюда.</li></ol>
    <input id="keyIn" placeholder="Вставьте ключ" autocomplete="off" value="${esc(key())}"><button class="btn primary" id="keySave">Сохранить</button>${key() ? ' <button class="btn ghost" id="keyBack">Назад</button>' : ''}</div>`;
}
function bindKey(){
  const s = $('#keySave'); if (!s) return;
  s.onclick = () => { LS.set('key', $('#keyIn').value.trim()); showKey = false; render(); };
  const b = $('#keyBack'); if (b) b.onclick = () => { showKey = false; render(); };
}

function render(){
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === tab));
  counts();
  if (view && view.io) view.io.disconnect(); view = null;
  const m = $('#main');
  if (showKey) { m.innerHTML = keyPanel(); bindKey(); return; }
  if (tab === 'search') renderSearch(m);
  else if (tab === 'pins') renderPins(m);
  else if (tab === 'favs') renderFavs(m);
  else { tab = 'search'; renderSearch(m); }
}

/* ---- 1. search ---- */
function renderSearch(m){
  if (!query) {
    m.innerHTML = `<div class="hero"><h1>Чьи снимки смотрим?</h1><p>Впишите имя фотографа и нажмите Enter</p>
      <form class="bar" id="sf"><div class="sw"><input id="si" placeholder="Например: Saul Leiter" autocomplete="off" style="width:100%"><div class="sugg" id="sugg" hidden></div></div><button class="btn primary">Найти</button></form>
      <div class="chips" style="justify-content:center">${['Morton Bartlett','Saul Leiter','Vivian Maier','Rinko Kawauchi','Francesca Woodman','Daido Moriyama'].map(n => `<button class="chip" data-q="${esc(n)}">${esc(n)}</button>`).join('')}</div>
      ${key() ? '' : keyPanel()}</div>`;
    bindSearch(); bindKey(); setTimeout(() => $('#si') && $('#si').focus(), 30); return;
  }
  const name = query, fav = isFav(name);
  m.innerHTML = `<form class="bar" id="sf"><div class="sw"><input id="si" value="${esc(name)}" autocomplete="off" style="width:100%"><div class="sugg" id="sugg" hidden></div></div><button class="btn primary">Найти</button></form>
    <div class="rhead"><div class="l"><h2>${esc(name)}</h2><button class="btn star ${fav ? 'on' : ''}" data-fav="${esc(name)}">${fav ? '★ В избранном' : '☆ В избранное'}</button></div>${modeSeg()}</div>
    <div id="vbox"></div>`;
  bindSearch();
  if (!key()) { $('#vbox').innerHTML = keyPanel(); bindKey(); return; }
  makeView($('#vbox'), cachedItems(name), { key: 'search:' + slug(name), more: () => fetchMore(name, 3), empty: 'Ничего не нашлось — проверьте написание имени.' });
}
function bindSearch(){
  const inp = $('#si'), box = $('#sugg'); let list = [], hi = -1, timer, seq = 0;
  const go = v => { v = v.trim(); query = v; LS.set('query', v); render(); };
  const close = () => { box.hidden = true; hi = -1; };
  const draw = () => {
    if (!list.length) return close();
    box.innerHTML = list.map((s, i) => `<div class="${i === hi ? 'on' : ''}" data-i="${i}"><b>${esc(s.name)}</b><span class="${s.photo ? 'ph' : ''}">${esc([s.ru, s.desc].filter(Boolean).join(' — '))}</span></div>`).join('');
    box.hidden = false;
  };
  inp.addEventListener('input', () => {
    clearTimeout(timer); const q = inp.value.trim();
    if (q.length < 2) { list = []; return close(); }
    timer = setTimeout(async () => { const my = ++seq; const r = await suggest(q); if (my !== seq || inp.value.trim() !== q) return; list = r; hi = -1; draw(); }, 450);
  });
  inp.addEventListener('keydown', e => {
    if (box.hidden) return;
    if (e.key === 'ArrowDown') { e.preventDefault(); hi = Math.min(list.length - 1, hi + 1); draw(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); hi = Math.max(-1, hi - 1); draw(); }
    else if (e.key === 'Escape') close();
    else if (e.key === 'Enter' && hi >= 0) { e.preventDefault(); go(list[hi].name); }
  });
  box.addEventListener('mousedown', e => { const d = e.target.closest('[data-i]'); if (d) { e.preventDefault(); go(list[+d.dataset.i].name); } });
  inp.addEventListener('blur', () => setTimeout(close, 150));
  $('#sf').addEventListener('submit', e => { e.preventDefault(); go(inp.value); });
}
/* name suggestions: several sources in parallel, ranked by how close the name is to what was typed */
const sugCache = new Map();
const CYR = {а:'a',б:'b',в:'v',г:'g',д:'d',е:'e',ё:'e',ж:'zh',з:'z',и:'i',й:'y',к:'k',л:'l',м:'m',н:'n',о:'o',п:'p',р:'r',с:'s',т:'t',у:'u',ф:'f',х:'h',ц:'ts',ч:'ch',ш:'sh',щ:'sch',ъ:'',ы:'y',ь:'',э:'e',ю:'yu',я:'ya',і:'i',ї:'yi',є:'ye',ґ:'g'};
const translit = s => String(s).toLowerCase().split('').map(c => CYR[c] ?? c).join('');
const norm = s => translit(String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '')).replace(/[^a-z0-9 ]+/g, ' ').replace(/\s+/g, ' ').trim();
function lev(a, b){ const m = a.length, n = b.length; if (!m) return n; if (!n) return m; let prev = Array.from({ length: n + 1 }, (_, j) => j); for (let i = 1; i <= m; i++) { const cur = [i]; for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); prev = cur; } return prev[n]; }
function closeness(q, name){
  const qt = norm(q).split(' ').filter(Boolean), nt = norm(name).split(' ').filter(Boolean);
  if (!qt.length || !nt.length) return 0;
  let sum = 0;
  qt.forEach((t, i) => {
    const last = i === qt.length - 1; let best = 0;
    for (const w of nt) {
      if (w === t) { best = 1; break; }
      if (w.startsWith(t) && (last || t.length >= 3)) { best = Math.max(best, last ? 0.95 : 0.9); continue; }
      const full = 1 - lev(t, w) / Math.max(t.length, w.length);
      const pre = last && w.length > t.length ? 1 - lev(t, w.slice(0, t.length)) / t.length : 0;
      best = Math.max(best, full, pre * 0.9);
    }
    sum += best;
  });
  const qj = qt.join(''), nj = nt.join('');
  const joined = Math.max(1 - lev(qj, nj) / Math.max(qj.length, nj.length), nj.length > qj.length ? (1 - lev(qj, nj.slice(0, qj.length)) / qj.length) * 0.9 : 0);
  return Math.max(sum / qt.length, joined);
}
const getJ = u => fetch(u).then(r => r.ok ? r.json() : {}).catch(() => ({}));
const swapComma = t => { const m = String(t).match(/^([^,()]+),\s*([^()]+)$/); return m ? (m[2].trim() + ' ' + m[1].trim()) : String(t).replace(/\s*\(.*?\)\s*$/, ''); };
/* common Russian spellings of Western first names and particles */
const NAME_EQ = { 'евген': 'eugene', 'евгений': 'eugene', 'юджин': 'eugene', 'ойген': 'eugen', 'эжен': 'eugene', 'фон': 'von', 'ван': 'van', 'дер': 'der', 'де': 'de', 'ди': 'di', 'дю': 'du', 'ле': 'le', 'ла': 'la', 'джон': 'john', 'жан': 'jean', 'пьер': 'pierre', 'анри': 'henri', 'ман': 'man', 'рэй': 'ray', 'майкл': 'michael', 'уильям': 'william', 'уилльям': 'william', 'роберт': 'robert', 'ричард': 'richard', 'стивен': 'stephen', 'джозеф': 'joseph', 'диана': 'diane', 'нан': 'nan', 'синди': 'cindy', 'вивиан': 'vivian', 'сол': 'saul', 'хельмут': 'helmut', 'ирвинг': 'irving', 'эдвард': 'edward', 'альфред': 'alfred', 'андре': 'andre', 'брассай': 'brassai', 'гарри': 'garry', 'ли': 'lee', 'сэлли': 'sally', 'франческа': 'francesca', 'дайдо': 'daido', 'ринко': 'rinko' };
const known = q => q.trim().split(/\s+/).map(w => NAME_EQ[w.toLowerCase()]).filter(Boolean).join(' ');
const latName = q => q.trim().split(/\s+/).map(w => NAME_EQ[w.toLowerCase()] || norm(w)).join(' ');
async function suggest(q){
  const k = q.toLowerCase(); if (sugCache.has(k)) return sugCache.get(k);
  const cyr = /[а-яёіїєґ]/i.test(q);
  const toks = s => s.trim().split(/\s+/).filter(Boolean);
  // any word may match (OR), with typo tolerance; the last word may still be unfinished
  // an unfinished last word of 1–2 letters is only used for ranking, not for the search itself
  const words = s => { const t = toks(s); return (t.length > 1 && t[t.length - 1].length < 3) ? t.slice(0, -1) : t; };
  const loose = s => words(s).map((t, i, a) => (i === a.length - 1 && t.length < 4) ? t + '*' : (t.length > 3 ? t + '~' : t)).join(' OR ');
  const strict = s => words(s).join(' ');
  const G = lang => `https://${lang}.wikipedia.org/w/api.php?format=json&origin=*&action=query&generator=search&prop=description${lang === 'ru' ? '|langlinks&lllang=en' : ''}&gsrlimit=`;
  const reqs = cyr ? [
    getJ(G('ru') + '15&gsrsearch=' + encodeURIComponent(loose(q))),
    getJ(G('ru') + '15&gsrsearch=' + encodeURIComponent(strict(q) + ' фотограф')),
    getJ(G('en') + '20&gsrsearch=' + encodeURIComponent(strict(latName(q)) + ' photographer')),
    // only the parts we can translate reliably (first name, von/van/de…), then rank by how the whole name sounds
    ...(known(q) ? [getJ(G('en') + '30&gsrsearch=' + encodeURIComponent(known(q) + ' (photographer OR artist OR sculptor)'))] : [])
  ] : [
    getJ(G('en') + '15&gsrsearch=' + encodeURIComponent(loose(q))),
    getJ(G('en') + '20&gsrsearch=' + encodeURIComponent(strict(q) + ' photographer')),
    getJ('https://www.wikidata.org/w/api.php?format=json&origin=*&action=wbsearchentities&type=item&limit=10&language=en&uselang=en&search=' + encodeURIComponent(q))
  ];
  const res = await Promise.all(reqs);
  const out = [];
  const tally = () => out.length;
  const consider = (title, enName, desc, alt) => {
    if (!title || /\b(surname|disambiguation|list of|фамилия|значения)\b/i.test(title + ' ' + (desc || ''))) return;
    const shown = swapComma(enName || title);
    const local = swapComma(title);
    const d = desc || '';
    const photo = /photograph|фотограф/i.test(d);
    const art = /artist|painter|sculptor|художни|скульптор|живопис/i.test(d);
    const person = photo || art || /\(\s*(born|b\.|род\.)?\s*\d{4}|\d{4}\s*[–-]\s*\d{4}|\bborn\b|родил/i.test(d) || /^[^,]+,\s*[^,]+$/.test(title);
    if (!person) return;
    const sim = Math.max(closeness(q, shown), closeness(q, local), cyr ? closeness(latName(q), shown) : 0, alt ? closeness(alt, shown) : 0);
    if (sim < 0.45) return;
    out.push({ name: shown, ru: local !== shown ? local : '', desc: d, photo, art, score: sim * 3 + (photo ? 1.2 : 0) + (art ? 0.4 : 0) });
  };
  for (const r of res) {
    if (r.query && r.query.pages) for (const pg of Object.values(r.query.pages)) consider(pg.title, pg.langlinks && pg.langlinks[0] && pg.langlinks[0]['*'], pg.description);
    if (r.search) for (const s of r.search) consider(s.label, s.label, s.description);
  }
  // typo fallback: Wikipedia's own "did you mean"
  if (tally() < 3) {
    const base = cyr ? latName(q) : q;
    const sj = await getJ('https://en.wikipedia.org/w/api.php?format=json&origin=*&action=query&list=search&srlimit=1&srinfo=suggestion&srsearch=' + encodeURIComponent(base));
    const sg = sj.query && sj.query.searchinfo && sj.query.searchinfo.suggestion;
    if (sg) { const r2 = await getJ(G('en') + '15&gsrsearch=' + encodeURIComponent(sg)); if (r2.query && r2.query.pages) for (const pg of Object.values(r2.query.pages)) consider(pg.title, null, pg.description, sg); }
  }
  const seen = new Set();
  const ranked = out.sort((a, b) => b.score - a.score).filter(s => { const n = norm(s.name); if (seen.has(n)) return false; seen.add(n); return true; }).slice(0, 10);
  if (ranked.length) sugCache.set(k, ranked);
  return ranked;
}

/* ---- 2. pins ---- */
function renderPins(m){
  if (!pins.length) { m.innerHTML = `<div class="hero"><h1>Пока без пинов</h1><p>Нажимайте 📌 на снимках во вкладке «Поиск» — они соберутся здесь.</p></div>`; return; }
  m.innerHTML = `<div class="rhead"><div class="l"><h2>Пины</h2><span class="sub">${pins.length} ${pl(pins.length, 'снимок', 'снимка', 'снимков')}</span></div>${modeSeg()}</div><div id="vbox"></div>`;
  makeView($('#vbox'), pins.slice(), { key: 'pins', more: null, empty: 'Пинов не осталось.' });
}

/* ---- mixed feed of several photographers ---- */
function mixed(names){
  const pools = names.map(n => shuffle(cachedItems(n))); const out = []; let i = 0;
  while (pools.some(p => p.length)) { const p = pools[i % pools.length]; if (p.length) out.push(p.shift()); i++; }
  return out;
}
function feedMore(names){
  return async () => {
    for (let tries = 0; tries < names.length; tries++) {
      const next = names.filter(n => !cache(n).done && !running.has(slug(n))).sort((a, b) => cache(a).items.length - cache(b).items.length)[0];
      if (!next) return null;
      const fresh = await fetchMore(next, 2);
      if (fresh === null) { if (!key()) return null; continue; }
      if (fresh.length) return shuffle(fresh);
    }
    return null;
  };
}

/* ---- 3. favorites ---- */
function renderFavs(m){
  if (!favs.length) { m.innerHTML = `<div class="hero"><h1>Избранных пока нет</h1><p>Найдите фотографа во вкладке «Поиск» и нажмите ☆ — его снимки появятся здесь общей лентой.</p></div>`; return; }
  m.innerHTML = `<div class="rhead"><div class="l"><h2>Избранные</h2></div>${modeSeg()}</div>
    <div class="chips" style="margin-bottom:16px">${favs.map(f => `<span class="chip"><span data-q="${esc(f.name)}">${esc(f.name)}</span><span class="x" data-unfav="${esc(f.name)}" title="Убрать из избранного">✕</span></span>`).join('')}</div>
    <div id="vbox"></div>`;
  if (!key()) { $('#vbox').innerHTML = keyPanel(); bindKey(); return; }
  const names = favs.map(f => f.name);
  makeView($('#vbox'), mixed(names), { key: 'favs', more: feedMore(names), empty: 'Снимков пока нет.' });
}
function toggleFav(name){
  if (isFav(name)) { favs = favs.filter(f => slug(f.name) !== slug(name)); toast('Убрано из избранного'); }
  else { favs.unshift({ name, added: Date.now() }); toast('★ ' + name + ' в избранном'); }
  LS.set('favs', favs); counts();
}

/* ============ lightbox ============ */
let lbI = 0;
function lbItems(){ return view ? view.items.filter(x => view.box.querySelector(`[data-id="${x.id}"]`)) : []; }
function openLb(id){ const l = lbItems(); lbI = Math.max(0, l.findIndex(x => x.id === id)); $('#lb').hidden = false; document.body.style.overflow = 'hidden'; syncLb(); }
function closeLb(){ $('#lb').hidden = true; document.body.style.overflow = ''; }
function syncLb(){
  const l = lbItems(); if (!l.length) return closeLb(); lbI = (lbI + l.length) % l.length; const it = l[lbI];
  const im = $('#lbImg'); im.onerror = () => { if (it.thumb && im.src !== it.thumb) im.src = it.thumb; }; if (im.src !== it.img) im.src = it.img;
  $('#lbT').innerHTML = `<b>${esc(it.owner)}</b><span>${esc(it.title)} · ${esc(it.domain)}</span>`;
  $('#lbC').textContent = `${lbI + 1} / ${l.length}`; $('#lbSrc').href = it.link || it.img;
  const pb = $('#lbPin'); pb.dataset.pin = it.id; setPinBtn(pb, isPinned(it.id));
}
$('#lbX').onclick = closeLb; $('#lbP').onclick = () => { lbI--; syncLb(); }; $('#lbN').onclick = () => { lbI++; syncLb(); };
$('#lbSt').onclick = e => { if (e.target.id === 'lbSt') closeLb(); };

/* ============ events ============ */
document.addEventListener('keydown', e => {
  if (document.activeElement && document.activeElement.tagName === 'INPUT') return;
  if (!$('#lb').hidden) { if (e.key === 'Escape') closeLb(); if (e.key === 'ArrowRight') { lbI++; syncLb(); } if (e.key === 'ArrowLeft') { lbI--; syncLb(); } return; }
  if (view && mode === 'cv') { if (e.key === 'ArrowRight') { e.preventDefault(); cvGo(view, view.idx + 1); } if (e.key === 'ArrowLeft') { e.preventDefault(); cvGo(view, view.idx - 1); } }
});
document.addEventListener('click', e => {
  const t = e.target;
  const pb = t.closest('[data-pin]'); if (pb) { e.stopPropagation(); togglePin(pb.dataset.pin); return; }
  const md = t.closest('[data-mode]'); if (md) { mode = md.dataset.mode; LS.set('mode', mode); render(); return; }
  const q = t.closest('[data-q]'); if (q) { query = q.dataset.q; LS.set('query', query); setTab('search'); return; }
  const fv = t.closest('[data-fav]'); if (fv) { toggleFav(fv.dataset.fav); render(); return; }
  const uf = t.closest('[data-unfav]'); if (uf) { toggleFav(uf.dataset.unfav); render(); return; }
  const ar = t.closest('[data-cv]'); if (ar && view) { cvGo(view, view.idx + (+ar.dataset.cv)); return; }
  if (t.closest('.src')) return;
  const tl = t.closest('.tile'); if (tl) { openLb(tl.dataset.id); return; }
  const sl = t.closest('.slide'); if (sl && view) { const all = [...view.wrap.querySelectorAll('.slide')]; const i = all.indexOf(sl); if (i === view.idx) openLb(sl.dataset.id); else cvGo(view, i); return; }
});

render();
})();
</script>
